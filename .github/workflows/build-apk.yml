name: Build Debug APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: '17' }

      - uses: subosito/flutter-action@v2
        with: { channel: stable }

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android SDK components and NDK
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" "platforms;android-35" \
            "build-tools;34.0.0" "build-tools;35.0.0" \
            "ndk;27.0.12077973"

      - name: Generate Android platform files
        run: flutter create --platforms android --org com.antigravity .

      - name: Add VIBRATE permission to AndroidManifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.VIBRATE" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.VIBRATE" />\n    <application|' "$MANIFEST"
          fi

      - name: Configure local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT"  >> android/local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: void_of_echoes-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
